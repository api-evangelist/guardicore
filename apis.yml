name: Guardicore
description: >-
  Guardicore is a micro-segmentation and Zero Trust network security company, founded in 2013 and
  backed by Battery Ventures and Partech, best known for its Centra platform for software-defined
  segmentation, application dependency mapping, and lateral-movement threat containment across data
  center, cloud, and hybrid environments. Guardicore was acquired by Akamai in 2021 and its technology
  now ships as Akamai Guardicore Segmentation; the guardicore.com domain redirects to the Akamai
  Segmentation product. This profile tracks Guardicore as a distinct company in the API Evangelist
  network. Its API reference is delivered through Akamai TechDocs and is login-gated, so no public
  OpenAPI or standalone developer surface was discoverable during enrichment.
